<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Panel Deportes Martínez</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="fotos/logo/iso-blanco.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=137">
</head>
<body class="admin-body">
  <section class="login-screen">
    <form class="login-card" id="loginForm">
      <h1>Panel del dueño</h1>
      <p>Administra tu tienda: productos, precios y stock.</p>
      <div class="field">
        <label>Correo</label>
        <input class="input" type="email" id="email" placeholder="tucorreo@negocio.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input class="input" type="password" id="pass" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="loginBtn">Entrar</button>
      <div class="form-err" id="loginErr"></div>
    </form>
  </section>
  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="js/login.js?v=137"></script>
</body>
</html>

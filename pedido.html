<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu pedido — Deportes Martínez</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://deportesmartinez.com.mx/pedido.html">
  <meta name="theme-color" content="#08070a">
  <link rel="icon" href="fotos/logo/favicon.png">
  <link rel="stylesheet" href="css/styles.css?v=136">
  <style>
    .pd-caja{max-width:560px;margin:0 auto;background:#101014;border:1px solid #24242c;border-radius:20px;padding:30px 24px;text-align:center}
    .pd-icono{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:30px;font-weight:800;background:#2a2109;color:#f7d154;border:1px solid #4a3f18}
    .pd-icono--espera{background:#141c2a;color:#8fb8ea;border-color:#2a3b57}
    .pd-icono--mal{background:#2a1212;color:#ff9b9b;border-color:#4a2222}
    .pd-titulo{font-family:var(--display,serif);font-size:34px;margin:0 0 8px;color:var(--ink,#f4f4f5)}
    .pd-sub{color:#a8a8b0;font-size:17px;line-height:1.6;margin:0 0 22px}
    .pd-sub:empty{display:none}
    .pd-caja--ok{text-align:left}
    .pd-ok{display:flex;align-items:center;gap:14px;margin:0 0 20px;font-family:var(--display,serif);font-size:40px;line-height:1.1;font-weight:800;color:var(--ink,#f4f4f5)}
    .pd-ok__i{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:inherit;font-size:24px;background:#2a2109;color:#f7d154;border:1px solid #4a3f18}
    @media (max-width:480px){.pd-ok{font-size:32px;gap:12px}.pd-ok__i{width:42px;height:42px;font-size:21px}}
    .pd-info{background:#15151a;border:1px solid #26262e;border-radius:14px;padding:4px 16px;margin-bottom:14px}
    .pd-info__folio{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #22222a}
    .pd-info__k{display:block;font-size:12.5px;color:#8a8a92;letter-spacing:.05em;text-transform:uppercase}
    .pd-info__ref{display:block;overflow-wrap:anywhere;font-family:var(--mono,monospace);font-size:24px;letter-spacing:.08em;color:#f4f4f5;margin-top:2px}
    .pd-info__entrega{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid #22222a;font-size:15px;color:#a8a8b0}
    .pd-info__entrega span:first-child{color:#f4f4f5;font-weight:700}
    .pd-info__seguir{color:var(--accent,#e8b923);font-weight:700;text-decoration:none}
    .pd-mini__fila{display:flex;align-items:center;gap:12px;padding:10px 0}
    .pd-mini__fila + .pd-mini__fila{border-top:1px solid #22222a}
    .pd-mini__fila b{display:block;color:#f4f4f5;font-weight:700;font-size:16px}
    .pd-nw{white-space:nowrap}
    .pd-mini__fila small{display:block;color:#8a8a92;font-size:14px;margin-top:2px}
    .pd-mini__foto{width:64px;height:64px;flex:none;border-radius:10px;object-fit:contain;background:#0e121d;border:1px solid #22222a}
    .pd-mini__foto--vacia{display:grid;place-items:center;font-size:26px}
    .pd-wa{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.5;color:#c9c9cf;margin:0 0 18px}
    .pd-wa svg{width:22px;height:22px;flex:none}
    .pd-final{margin:16px 0 0;font-size:15px;line-height:1.55;color:#9a9aa2}
    .pd-final a{color:var(--accent,#e8b923)}
    .pd-folio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:#15151a;border:1px dashed #3a3a44;border-radius:14px;padding:16px;margin-bottom:14px}
    .pd-folio__k{width:100%;font-size:13.5px;color:#8a8a92;letter-spacing:.06em;text-transform:uppercase}
    .pd-folio__v{overflow-wrap:anywhere;font-family:var(--mono,monospace);font-size:34px;letter-spacing:.1em;color:#f4f4f5}
    .pd-folio__cp{background:none;border:1px solid #2e2e38;color:var(--accent,#e8b923);border-radius:9px;padding:8px 15px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
    .pd-aviso{background:#2a2109;border:1px solid #4a3f18;color:#f7d154;border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.6;text-align:left;margin:0 0 18px}
    .pd-nota{color:#a8a8b0;font-size:16px;margin:0 0 18px}
    .pd-lista{list-style:none;margin:0 0 16px;padding:0;text-align:left}
    .pd-lista li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #22222a;font-size:16px}
    .pd-lista li span{color:#8a8a92;font-size:15px;white-space:nowrap}
    .pd-entrega{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;text-align:left;font-size:16px;margin:0 0 22px}
    .pd-entrega__k{font-weight:800;color:#f4f4f5}
    .pd-entrega__v{color:#a8a8b0}
    .pd-acciones{display:flex;flex-direction:column;gap:10px}
    .pd-acciones .btn-cta{display:block;text-align:center;font-size:17px;padding:16px}
    .pd-btn{display:block;text-align:center;border:1px solid #2e2e38;color:#f4f4f5;border-radius:12px;padding:15px;font-weight:700;font-size:16px;text-decoration:none}
    .pd-btn:hover{border-color:var(--accent,#e8b923);color:var(--accent,#e8b923)}
  </style>
</head>

        <span class="brand__word">

    </div>

  <main class="wrap sec sec--top">

  </main>

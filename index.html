<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deportes Martínez</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --negro:#050506; --oro:#e8b923; --oro2:#f7d154; --humo:#9a9aa2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--negro); color:#fff; min-height:100dvh;
    display:grid; place-items:center; padding:28px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    text-align:center; overflow:hidden;
  }
  .halo {
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 38%, rgba(232,185,35,.13), transparent 62%);
  }
  .caja { position:relative; max-width:520px; animation:sube .9s cubic-bezier(.2,.7,.3,1) both; }
  .logo { width:min(210px,52vw); height:auto; margin:0 auto 34px; display:block;
          filter:drop-shadow(0 12px 40px rgba(232,185,35,.22)); }
  h1 {
    font-size:clamp(30px,8vw,46px); font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; line-height:1.1;
    background:linear-gradient(100deg,var(--oro),var(--oro2) 45%,var(--oro));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .raya { width:62px; height:2px; margin:24px auto; border-radius:2px;
          background:linear-gradient(90deg,transparent,var(--oro),transparent); }
  p { color:var(--humo); font-size:clamp(15px,3.6vw,17px); line-height:1.65; }
  .marca { margin-top:38px; font-size:11.5px; letter-spacing:.34em;
           text-transform:uppercase; color:#4a4a52; }
  @keyframes sube { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { .caja { animation:none; } }
</style>
</head>
<body>
  <div class="halo"></div>
  <main class="caja">
    <img class="logo" src="logo-cuadrado.webp" alt="Deportes Martínez">
    <h1>Próximamente</h1>
    <div class="raya"></div>
    <p>Estamos preparando nuestra tienda en línea.<br>Muy pronto vas a poder comprar tus jerseys aquí.</p>
    <div class="marca">Deportes Martínez · Guadalajara</div>
  </main>
</body>
</html>
